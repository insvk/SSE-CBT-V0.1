<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candidate Login | PROJECT APEX OMEGA</title>
    
    <style>
      body { display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #e2e8f0; }
      .login-card { background: white; padding: 3rem; border-radius: var(--radius); box-shadow: var(--shadow); width: 100%; max-width: 450px; }
      .login-header { text-align: center; margin-bottom: 2.5rem; }
      .login-header img { width: 80px; margin-bottom: 1rem; }
      .form-group { margin-bottom: 1.5rem; }
      .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--text-main); font-size: 0.875rem; }
      .form-control { width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: var(--radius); font-size: 1rem; }
      .btn-block { width: 100%; padding: 0.75rem; font-size: 1rem; }
    </style>
    <link rel="stylesheet" href="/assets/style-abd8dbfa.css">
  </head>
  <body>
    
    <div class="login-card">
      <div class="login-header">
        <h1 style="color: var(--primary);">APEX OMEGA CBT</h1>
        <p style="color: var(--text-muted); margin-top: 0.5rem;">Secure Candidate Portal</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label>Registration Number</label>
          <input type="text" class="form-control" id="reg_no" placeholder="Enter Roll No or Registration ID" required>
        </div>
        <div class="form-group">
          <label>Password (DOB or Issued PIN)</label>
          <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>
    </div>

    <script>
      document.getElementById('login-form').addEventListener('submit', (e) => {
        e.preventDefault();
        // In a real app, authenticate against Supabase/FastAPI here.
        // On success, transition to instructions page:
        window.location.href = '/instructions.html';
      });
    </script>
  </body>
</html>
